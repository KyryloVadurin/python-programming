      - "Тема 3. Впорядковані структури даних (Списки, Кортежі)": lk/lk3.md
      - "Тема 4. Текстові, двійкові дані та Регулярні вирази": lk/lk4.md
      - "Тема 5. Хеш-таблиці (Словники, Множини)": lk/lk5.md
      - "Тема 6. Функціональна організація коду": lk/lk6.md
      - "Тема 7. Модульна архітектура та пакети": lk/lk7.md
      - "Тема 8. Обробка винятків та файлове в/в": lk/lk8.md
      - "Тема 9. Об'єктно-орієнтоване програмування": lk/lk9.md

  - Лабораторні роботи:
      - "ЛБ 1. Розгортання інфраструктури розробки": lb/lb1.md
      - "ЛБ 2. Скалярні типи даних та моделювання": lb/lb2.md
      - "ЛБ 3. Алгоритми розгалуженої та циклічної структури": lb/lb3.md
      - "ЛБ 4. Обробка списків та кортежі": lb/lb4.md
      - "ЛБ 5. Обробка тексту та регулярні вирази": lb/lb5.md
      - "ЛБ 6. Асоціативні структури даних (Словники, Множини)": lb/lb6.md
      - "ЛБ 7. Проєктування функцій та рекурсія": lb/lb7.md
      - "ЛБ 8. Модульне програмування та системні бібліотеки": lb/lb8.md
      - "ЛБ 9. Обробка виняткових ситуацій": lb/lb9.md
